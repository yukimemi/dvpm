# kata-managed — source: yukimemi/pj-denops/.github/workflows/ci.yml.tera
# Local edits are reverted on the next `kata apply`. Push fixes upstream.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Vim. rhysd/action-setup-vim builds from source, which only works
      # on Linux runners here; thinca/action-setup-vim installs a prebuilt
      # Vim on macOS / Windows. Both expose the same `executable` output,
      # coalesced into DENOPS_TEST_VIM_EXECUTABLE below.
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        if: matrix.os == 'ubuntu-latest'
        id: vim-rhysd
        with:
          version: "v9.2.0148"

      - uses: thinca/action-setup-vim@40587a4deeeaf61ef8086bd3badd42e734a67093 # v3
        if: matrix.os != 'ubuntu-latest'
        id: vim-thinca
        with:
          vim_type: "Vim"
          vim_version: "v9.2.0148"

      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        id: nvim
        with:
          neovim: true
          version: "v0.12.4"

      - uses: denoland/setup-deno@v2

      # `@denops/test` spawns these binaries directly; without the two
      # env vars every `test({ mode: "vim" | "nvim" })` case fails.
      #
      # No `shell:` override on purpose — each runner's default shell is
      # used. Forcing `shell: bash` routes Windows through Git Bash, which
      # mangles the Windows-style editor paths in the env vars below and
      # hangs the nvim cases instead of failing them.
      - name: Run CI
        run: deno task ci
        env:
          DENOPS_TEST_VIM_EXECUTABLE: ${{ steps.vim-rhysd.outputs.executable || steps.vim-thinca.outputs.executable }}
          DENOPS_TEST_NVIM_EXECUTABLE: ${{ steps.nvim.outputs.executable }}